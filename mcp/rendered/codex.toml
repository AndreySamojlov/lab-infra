# MCP server configuration for Codex Desktop / CLI.
#
# Generated by scripts/render-mcp-configs.py from mcp/servers.json.
# Do not edit this file manually — your changes will be overwritten.
#
# Merge the blocks below into ~/.codex/config.toml (user-level) or into
# a project-scoped .codex/config.toml (only inside a trusted project).
#
# Codex should connect to hosted n8n-mcp via direct remote HTTP MCP.
# Avoid wrapping this endpoint in mcp-remote for Codex: in long
# desktop sessions that stdio bridge can turn server-side 400 errors
# into 120s tool-call timeouts.
#
# Config changes are read on Codex startup; fully restart Codex or
# open a fresh dialog after applying this block.

# Community n8n-mcp server (rich builder layer on top of the n8n API).
[mcp_servers.n8n-mcp]
url = "https://n8n-mcp.samandrey.work/mcp"
bearer_token_env_var = "N8N_MCP_AUTH_TOKEN"
startup_timeout_sec = 60
